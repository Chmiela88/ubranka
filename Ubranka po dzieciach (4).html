:root{--bg:#faf7f2;--card:#fff;--tx:#2b2a28;--mut:#7a746b;--ac:#c2603a;--ac2:#fff;--bd:#e8e1d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#1d1b19;--card:#292623;--tx:#f1ece4;--mut:#a39b8f;--ac:#e0825c;--ac2:#1d1b19;--bd:#3a3631;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 48px}

.sub{color:var(--mut);margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;cursor:pointer;position:relative;display:block;color:inherit;text-decoration:none}
.tile img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.tile .in{padding:10px 12px}
.tile .t{font-size:.92rem;line-height:1.3;max-height:2.6em;overflow:hidden}
.tile .p{font-weight:700;color:var(--ac);margin-top:4px}
.num{position:absolute;top:8px;left:8px;background:var(--ac);color:var(--ac2);border-radius:999px;font-size:.78rem;font-weight:700;padding:2px 9px}
.sold{position:absolute;inset:0 0 auto 0;background:rgba(0,0,0,.55);color:#fff;text-align:center;padding:6px;font-weight:700;aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.add{border:2px dashed var(--bd);background:transparent;min-height:200px;display:flex;align-items:center;justify-content:center;flex-direction:column;color:var(--mut);font-size:.95rem;text-align:center;padding:10px}
.add b{font-size:2rem;color:var(--ac)}
button,.btn{font:inherit;border:0;border-radius:10px;padding:10px 16px;background:var(--ac);color:var(--ac2);cursor:pointer;text-decoration:none;display:inline-block;font-weight:600}
button.sec,.btn.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button:disabled{opacity:.5;cursor:default}
.bar{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;margin-bottom:18px;font-size:.9rem;color:var(--mut)}
.det{display:grid;gap:20px}
@media(min-width:720px){.det{grid-template-columns:1fr 1fr}}
.det img{width:100%;border-radius:14px;display:block}
.thumbs{display:flex;gap:8px;margin-top:8px}
.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:8px;cursor:pointer;border:1px solid var(--bd)}
.price{font-size:1.6rem;font-weight:800;color:var(--ac);margin:4px 0 10px}
.chips span{display:inline-block;background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:2px 12px;margin:0 6px 6px 0;font-size:.88rem}
.desc{white-space:pre-wrap;margin:14px 0}
.contact{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
a.back{color:var(--mut);text-decoration:none;display:inline-block;margin-bottom:12px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:max(16px,env(safe-area-inset-top,0px)) 12px 24px;z-index:20}
#modal.on{display:flex}
.box{background:var(--bg);border-radius:16px;padding:18px;width:100%;max-width:560px}
label{display:block;font-size:.85rem;color:var(--mut);margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:9px 11px;border-radius:9px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
textarea{min-height:200px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

.hint{font-size:.84rem;color:var(--mut);margin-top:6px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
details{margin-bottom:16px}

  const m = location.hash.match(/^#\/p\/(.+)$/);
  const it = m && S.items.find(x => x.id === m[1]);
  $('#app').innerHTML = it ? detail(it) : home();
  window.scrollTo(0, 0);
}

function home() {
  const st = S.settings;
  let h = '<h1>Ubranka po dzieciach</h1><p class="sub">Używane, zadbane, z Bydgoszczy. Kliknij kafelek, żeby zobaczyć opis. Zakupy odbywają się przez OLX.</p>';
  if (admin) {
    h += '<div class="bar">Tryb właściciela. Kliknij ostatni kafelek, żeby dodać zdjęcie. Po wystawieniu na OLX wejdź w ogłoszenie i dodaj link.</div>';
  }
  h += '<div class="grid">';
  S.items.forEach((x, i) => {
    h += '<a class="tile" href="#/p/' + esc(x.id) + '"><span class="num">' + (i + 1) + '</span>' +
      '<img src="' + x.img + '" alt="">' + (x.sold ? '<div class="sold">Sprzedane</div>' : '') +
      '<div class="in"><div class="t">' + esc(x.title) + '</div><div class="p">' + zl(x.price) + '</div>' + (admin ? '<div class="hint">' + (x.nr ? 'nr ' + esc(x.nr) + ' · ' : '') + (x.olx ? 'link OLX jest' : 'brak linku OLX') + '</div>' : '') + '</div></a>';
  });
  if (admin) h += '<div class="tile add" onclick="openEditor()"><b>+</b>Kafelek nr ' + (S.items.length + 1) + '<br>dodaj zdjęcie</div>';
  if (!S.items.length && !admin) h += '<p class="sub">Wkrótce pojawią się tu ubranka.</p>';
  return h + '</div>';
}

function detail(x) {
  const st = S.settings, n = S.items.indexOf(x) + 1;
  const subj = encodeURIComponent('Ubranko nr ' + n + ': ' + x.title);
  const ph = x.photos && x.photos.length ? x.photos : [x.img];
  const ok = /^https?:\/\//i.test(x.olx || '');
  const c = ok ? '<a class="btn" href="' + esc(x.olx) + '" target="_blank" rel="noopener">Kup na OLX</a><span class="hint" style="align-self:center">Zakup i płatność przez OLX</span>' : '';
  let a = '';
  if (admin) a = '<div class="acts"><button class="sec" onclick="copyAd(\'' + x.id + '\')">Kopiuj ogłoszenie</button><button class="sec" onclick="openEditor(\'' + x.id + '\')">Edytuj / dodaj link OLX</button>' +
    '<button class="sec" onclick="toggleSold(\'' + x.id + '\')">' + (x.sold ? 'Przywróć' : 'Oznacz jako sprzedane') + '</button>' +
    '<button class="sec" onclick="delItem(\'' + x.id + '\')">Usuń</button></div>';
  return '<a class="back" href="#/">← Wszystkie ubranka</a><div class="det"><div><img id="mainimg" src="' + ph[0] + '" alt="">' + (ph.length > 1 ? '<div class="thumbs">' + ph.map(u => '<img src="' + u + '" alt="" onclick="mainimg.src=this.src">').join('') + '</div>' : '') + '</div><div>' +
    '<div class="chips"><span>Nr ' + n + '</span><span>' + esc(x.brand) + '</span><span>Rozmiar ' + esc(x.size) + '</span><span>Stan: ' + esc(COND[x.cond] || x.cond) + '</span>' + (x.sold ? '<span>Sprzedane</span>' : '') + '</div>' +
    '<h1>' + esc(x.title) + '</h1><div class="price">' + zl(x.price) + '</div>' +
    '<div class="desc">' + esc(x.desc) + '</div>' +
    (x.sold ? '' : '<div class="contact">' + (c || '<span class="hint">Ogłoszenie na OLX pojawi się wkrótce.</span>') + '</div>') + a + '</div></div>';
}

async function copyAd(id) {
  const x = S.items.find(i => i.id === id);
  try { await navigator.clipboard.writeText(x.title + '\n\n' + x.desc); alert('Skopiowano tytuł i opis. Wklej je w nowym ogłoszeniu na OLX.'); }
  catch (e) { alert('Nie udało się skopiować automatycznie. Otwórz Edytuj i skopiuj tekst ręcznie.'); }
}
async function saveSettings() {
  S.settings.email = $('#s_email').value.trim();
  S.settings.phone = $('#s_phone').value.trim();
  S.settings.olx = $('#s_olx').value.trim();
  await publish();
}
async function toggleSold(id) { const x = S.items.find(i => i.id === id); x.sold = !x.sold; await publish(); }
async function delItem(id) { if (!confirm('Usunąć to ogłoszenie?')) return; S.items = S.items.filter(i => i.id !== id); location.hash = '#/'; await publish(); }

function openEditor(id) {
  const x = id ? S.items.find(i => i.id === id) : null;
  draft = x ? {...x, photos: (x.photos || [x.img]).slice(), blob: null} : {id: 'i' + Date.now().toString(36), img: '', photos: [], blob: null, cond: 'bb', brand: '', size: '', title: '', desc: '', price: ''};
  const m = $('#modal');
  m.innerHTML = '<div class="box"><h2 style="margin:0 0 4px">' + (x ? 'Edytuj ogłoszenie' : 'Nowe ubranko, kafelek nr ' + (S.items.length + 1)) + '</h2>' +
    '<div class="hint">Nazwij pliki: stan_marka_rozmiar_numerubrania_zd1 (zd2, zd3), np. bb_Zara_98_12_zd1. Dane odczytam z nazwy pierwszego zdjęcia.</div>' +
    '<label>Zdjęcia (1 do 3, pierwsze trafi na kafelek)</label><input type="file" id="f" accept="image/*" multiple onchange="onFiles(this.files)">' +
    '<div id="pv"></div>' +
    '<div class="row"><div><label>Stan</label><select id="d_cond"><option value="bb">bb: bardzo dobry</option><option value="db">db: dobry</option></select></div>' +
    '<div><label>Marka</label><input id="d_brand"></div><div><label>Rozmiar</label><input id="d_size"></div></div>' +
    '<div class="acts"><button id="gen" onclick="gen()">Wygeneruj opis</button></div><div class="hint" id="msg"></div>' +
    '<label>Tytuł</label><input id="d_title"><label>Cena (zł)</label><input id="d_price" type="number" inputmode="numeric">' +
    '<div class="hint" id="pnote"></div><label>Opis</label><textarea id="d_desc"></textarea>' +
    '<label>Link do ogłoszenia na OLX (wklej po wystawieniu)</label><input id="d_olx" placeholder="https://www.olx.pl/d/oferta/...">' +
    '<div class="acts"><button id="ok" onclick="accept()">Zaakceptuj i opublikuj</button><button class="sec" onclick="closeEd()">Anuluj</button></div></div>';
  showPrev(); $('#d_cond').value = draft.cond; $('#d_brand').value = draft.brand; $('#d_size').value = draft.size;
  $('#d_title').value = draft.title; $('#d_price').value = draft.price; $('#d_desc').value = (draft.desc || '').replace(NOTE, '').trim(); $('#d_olx').value = draft.olx || '';
  m.classList.add('on');
}
function closeEd() { $('#modal').classList.remove('on'); $('#modal').innerHTML = ''; }

async function shrink(f, max) {
  const bmp = await createImageBitmap(f), k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const cv = document.createElement('canvas'); cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
  cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
  return cv.toDataURL('image/jpeg', 0.78);
}
function toBlob(u) {
  const s = atob(u.split(',')[1]), a = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i);
  return new Blob([a], {type: 'image/jpeg'});
}
async function onFiles(list) {
  const all = Array.from(list).sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric: true}));
  const fs = all.slice(0, 3);
  if (!fs.length) return;
  const p = fs[0].name.replace(/\.[^.]+$/, '').split('_');
  if (['bb', 'db'].includes((p[0] || '').toLowerCase())) $('#d_cond').value = p[0].toLowerCase();
  if (p[1]) $('#d_brand').value = p[1];
  if (p[2]) $('#d_size').value = p[2];
  draft.nr = /^\d+$/.test(p[3] || '') ? p[3] : (draft.nr || '');
  const key = f => f.name.split('_').slice(0, 4).join('_').toLowerCase();
  const warn = fs.some(f => key(f) !== key(fs[0]));
  $('#msg').textContent = (all.length > 3 ? 'Wzięto pierwsze 3 zdjęcia. ' : '') + (warn ? 'Uwaga: nazwy plików różnią się stanem, marką, rozmiarem lub numerem ubrania. Sprawdź, czy to na pewno ta sama rzecz.' : '');
  draft.photos = [];
  for (let i = 0; i < fs.length; i++) draft.photos.push(await shrink(fs[i], i ? 700 : 900));
  draft.img = draft.photos[0];
  showPrev();
}
function showPrev() {
  $('#pv').innerHTML = draft.photos.map(u => '<img class="prev" style="max-height:140px;width:auto;display:inline-block;margin-right:6px" src="' + u + '" alt="">').join('') + (draft.photos.length ? '<div class="hint">Liczba zdjęć: ' + draft.photos.length + '. Pierwsze trafi na kafelek.</div>' : '');
}

async function gen() {
  const cond = $('#d_cond').value, brand = $('#d_brand').value.trim(), size = $('#d_size').value.trim();
  if (!draft.photos.length) { $('#msg').textContent = 'Najpierw dodaj zdjęcie.'; return; }
  if (!brand || !size) { $('#msg').textContent = 'Uzupełnij markę i rozmiar.'; return; }
  if (!sample) { $('#msg').textContent = 'Generowanie działa tylko po otwarciu strony w Claude jako właściciel. Możesz wpisać opis ręcznie.'; return; }
  const b = $('#gen'); b.disabled = true; $('#msg').textContent = 'Piszę opis…';
  const prompt = 'Jesteś asystentem sprzedaży używanych ubranek dziecięcych na OLX. Pisz po polsku, ciepło i rzeczowo. ' +
    'Na zdjęciach (1–3 ujęcia tego samego ubrania) jest ubranie. Wykorzystaj wszystkie ujęcia, np. metkę, detale i ewentualny mankament. Dane od właściciela: marka: ' + brand + ', rozmiar: ' + size + ', stan: ' + (cond === 'bb' ? 'bardzo dobry' : 'dobry, ze śladami użytkowania') + '. ' +
    'Rozpoznaj rodzaj, kolor, wzór, krój i szczegóły widoczne na zdjęciu. Niczego nie wymyślaj (skład, wad, szczegółów, których nie widać). ' +
    'Napisz tytuł (do 70 znaków: rodzaj, marka, rozmiar, kolor) oraz opis: 1–2 zdania wstępu, marka/rozmiar/kolor/rodzaj, uczciwie stan, szczegóły, zachęta do pytań o inne rzeczy i zniżki przy kilku sztukach. ' +
    'NIE dodawaj informacji o odbiorze i wysyłce. Oszacuj uczciwą cenę używanej rzeczy w zł (bb to zwykle 30–45% ceny nowego, db 20–30%) i cenę minimalną. Nie masz dostępu do internetu, więc to szacunek z Twojej wiedzy. ' +
    'Zwróć WYŁĄCZNIE JSON bez markdown: {"title":"","description":"","price":0,"min_price":0,"price_note":"jedno zdanie o podstawie wyceny"}';
  try {
    const opts = {};
    try { if ((await sample.limits()).images) opts.images = draft.photos.map(toBlob); } catch (e) {}
    const r = await sample(prompt, opts);
    const j = JSON.parse(r.text.replace(/```json|```/g, '').trim());
    $('#d_title').value = j.title; $('#d_desc').value = j.description; $('#d_price').value = Math.round(j.price);
    $('#pnote').textContent = 'Cena minimalna (tylko dla Ciebie): ' + zl(j.min_price) + '. ' + (j.price_note || '') + ' To szacunek, sprawdź podobne ogłoszenia na OLX.';
    $('#msg').textContent = 'Gotowe. Popraw, co trzeba, i zaakceptuj.';
  } catch (e) { $('#msg').textContent = 'Nie udało się wygenerować opisu (' + (e.code || e.message || 'błąd') + '). Spróbuj ponownie.'; }
  b.disabled = false;
}

async function accept() {
  const d = draft;
  d.cond = $('#d_cond').value; d.brand = $('#d_brand').value.trim(); d.size = $('#d_size').value.trim();
  d.title = $('#d_title').value.trim(); d.price = Number($('#d_price').value);
  d.desc = $('#d_desc').value.replace(NOTE, '').trim() + '\n\n' + NOTE;
  d.olx = $('#d_olx').value.trim();
  if (d.olx && !/^https?:\/\//i.test(d.olx)) { $('#msg').textContent = 'Link do OLX powinien zaczynać się od https://'; return; }
  if (!d.img || !d.title || !d.price || !d.desc.trim()) { $('#msg').textContent = 'Potrzebne: zdjęcie, tytuł, cena i opis.'; return; }
  d.img = d.photos[0]; delete d.blob;
  const i = S.items.findIndex(x => x.id === d.id);
  if (i >= 0) S.items[i] = d; else S.items.push(d);
  $('#ok').disabled = true;
  if (!(await publish())) { $('#ok').disabled = false; }
}

window.addEventListener('hashchange', render);
render();
(async () => {
  if (!window.claude) return;
  try { const u = await claude.use('user'); admin = !!(u && u.isOwner && u.isOwner()); } catch (e) {}
  try { artifact = await claude.use('artifact'); } catch (e) {}
  try { sample = await claude.use('sample'); } catch (e) {}
  if (admin) render();
})();
</script>
